<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#1b1b3a" />
  <title>Kundli Kaka is offline</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #fff4dc; color: #1b1b3a; font-family: system-ui, sans-serif; text-align: center; }
    main { max-width: 420px; }
    svg { width: 88px; height: 88px; }
    h1 { font-size: 1.8rem; margin: 16px 0 8px; }
    p { line-height: 1.55; margin: 0 0 20px; }
    button { font: inherit; font-weight: 700; padding: 13px 26px; border-radius: 999px; border: 2px solid #1b1b3a; background: #f6b81c; color: #1b1b3a; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#f6b81c" stroke="#1b1b3a" stroke-width="5"/><path d="M32 3a29 29 0 0 1 0 58a18 29 0 0 0 0-58z" fill="#d8321a"/></svg>
    <h1>You are offline</h1>
    <p>Kundli Kaka needs the internet to work out today's sky. Check your connection and try again. Pages you opened before may still open.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
