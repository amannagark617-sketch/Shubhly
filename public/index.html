<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shubhly: Kundli, Puja &amp; more</title>
  <meta name="description" content="Free daily rashifal, panchang and choghadiya, plus your kundli in minutes. Shubhly: your kundli, your puja, your vibe." />
  <meta name="theme-color" content="#f6b81c" />
  <meta property="og:title" content="Shubhly: Kundli, Puja &amp; more" />
  <meta property="og:description" content="Daily rashifal, panchang, choghadiya and your kundli, in English, Hindi or Hinglish." />
  <meta property="og:image" content="/img/og-image.jpg" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23f6b81c' stroke='%231b1b3a' stroke-width='5'/%3E%3Cpath d='M32 3a29 29 0 0 1 0 58a18 29 0 0 0 0-58z' fill='%23d8321a'/%3E%3C/svg%3E" />
  <link rel="preload" href="/fonts/yatra-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/hind-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="progress" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <header class="nav">
    <div class="wrap nav-in">
      <a class="brand" href="#top" aria-label="Shubhly">
        <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#f6b81c" stroke="#1b1b3a" stroke-width="5"/><path d="M32 3a29 29 0 0 1 0 58a18 29 0 0 0 0-58z" fill="#d8321a"/></svg>
        Shubhly
      </a>
      <nav class="nav-links" aria-label="Main">
        <a href="#aaj" data-i="nav_today"></a>
        <a href="#rashifal" data-i="nav_rashifal"></a>
        <a href="#kundli" data-i="nav_kundli"></a>
        <a href="#premium" class="nav-premium"><span data-i="nav_premium"></span></a>
        <a href="#store" data-i="nav_store"></a>
        <a href="#faq" data-i="nav_faq"></a>
      </nav>
      <div class="nav-end">
        <span class="streak" id="streak" hidden></span>
        <div class="lang" role="group" data-i-aria="lang_label">
          <button type="button" data-lang="en" aria-pressed="false"><span class="long">English</span><span class="short">EN</span></button>
          <button type="button" data-lang="hi" aria-pressed="false"><span class="long">हिंदी</span><span class="short">हि</span></button>
          <button type="button" data-lang="hn" aria-pressed="false"><span class="long">Hinglish</span><span class="short">Hn</span></button>
        </div>
        <a class="btn btn-primary nav-cta" href="#kundli" data-i="nav_cta"></a>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero" aria-labelledby="hero-h">
      <canvas id="stars" aria-hidden="true"></canvas>
      <div class="wrap hero-in">
        <div>
          <h1 id="hero-h" data-i="hero_h"></h1>
          <p class="hero-lead" data-i="hero_lead"></p>
          <div class="hero-cta">
            <a class="btn btn-primary" href="#kundli" data-i="hero_cta1"></a>
            <a class="btn btn-line" href="#rashifal" data-i="hero_cta2"></a>
          </div>
          <ul class="trust">
            <li data-i="trust1"></li>
            <li data-i="trust2"></li>
            <li data-i="trust3"></li>
          </ul>
        </div>
        <aside class="moon-card" aria-live="polite">
          <div class="orbit" id="orbit"><div id="moonBox"></div></div>
          <p class="moon-day" id="moonDay"></p>
          <div class="moon-tithi" id="moonTithi"></div>
          <p class="moon-sub" id="moonSub"></p>
          <dl class="moon-facts" id="moonFacts"></dl>
        </aside>
      </div>
    </section>

    <div class="marquee" aria-hidden="true"><div class="track" id="marqueeTrack"></div></div>

    <section class="s3d" id="s3d" aria-labelledby="s3d-h">
      <div class="s3d-stick">
        <div class="wrap s3d-in">
          <div class="s3d-copy">
            <h2 id="s3d-h" data-i="s3d_h"></h2>
            <ol class="s3d-steps">
              <li data-s="0"><h3 data-i="s3d_1h"></h3><p data-i="s3d_1p"></p></li>
              <li data-s="1"><h3 data-i="s3d_2h"></h3><p data-i="s3d_2p"></p></li>
              <li data-s="2"><h3 data-i="s3d_3h"></h3><p data-i="s3d_3p"></p></li>
            </ol>
          </div>
          <div class="s3d-scene" aria-hidden="true"><div class="s3d-obj" id="s3dObj"></div></div>
        </div>
      </div>
    </section>

    <section class="block" id="aaj" aria-labelledby="aaj-h">
      <div class="wrap">
        <div class="sec-head">
          <h2 id="aaj-h" data-i="aaj_h"></h2>
          <p data-i="aaj_p"></p>
          <div class="loc-line">
            <span id="locName">Delhi</span>
            <button type="button" class="link-btn" id="locChange" data-i="loc_change"></button>
          </div>
          <div class="loc-edit" id="locEdit" hidden>
            <label class="field">
              <span data-i="loc_label"></span>
              <input type="text" id="locInput" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="locList" />
              <ul class="places" id="locList" role="listbox" hidden></ul>
            </label>
          </div>
        </div>
        <div class="now-strip" id="nowStrip" hidden></div>
        <div id="panchang"><div class="skeleton" style="height:260px"></div></div>
      </div>
    </section>

    <section class="block block--tight" id="rashifal" aria-labelledby="rf-h">
      <div class="wrap">
        <div class="banner">
          <img src="/img/rashifal-banner.jpg" alt="" width="1600" height="500" loading="lazy" />
          <div class="banner-in">
            <h2 id="rf-h" data-i="rf_h"></h2>
            <p data-i="rf_p"></p>
          </div>
        </div>
        <div class="date-nav">
          <button type="button" class="icon-btn" id="dPrev" data-i-aria="d_prev">&#8249;</button>
          <div class="date-now" id="dNow" aria-live="polite"></div>
          <button type="button" class="icon-btn" id="dNext" data-i-aria="d_next">&#8250;</button>
          <div class="quick" role="group">
            <button type="button" data-day="-1" data-i="d_yesterday"></button>
            <button type="button" data-day="0" data-i="d_today"></button>
            <button type="button" data-day="1" data-i="d_tomorrow"></button>
          </div>
        </div>
        <div class="rashi-grid" id="rashiGrid" role="group" data-i-aria="rf_pick_aria"></div>
        <div id="reading"></div>

        <h3 class="sub-h" data-i="vrat_h"></h3>
        <ul class="vrat" id="vrat"></ul>
        <p class="fine" data-i="vrat_fine"></p>
      </div>
    </section>

    <section class="block block--tight" id="kundli" aria-labelledby="k-h">
      <div class="wrap">
        <div class="banner">
          <img src="/img/kundli-banner.jpg" alt="" width="1600" height="500" loading="lazy" />
          <div class="banner-in">
            <h2 id="k-h" data-i="k_h"></h2>
            <p data-i="k_p"></p>
          </div>
        </div>

        <div class="saved" id="saved" hidden></div>

        <form class="card" id="form" novalidate>
          <label class="field">
            <span data-i="f_name"></span>
            <input type="text" id="name" autocomplete="given-name" maxlength="60" />
          </label>
          <div class="row">
            <label class="field">
              <span data-i="f_date"></span>
              <input type="date" id="date" min="1900-01-01" required />
            </label>
            <label class="field">
              <span data-i="f_time"></span>
              <input type="time" id="time" value="10:00" />
            </label>
          </div>
          <label class="check"><input type="checkbox" id="timeUnknown" /> <span data-i="f_time_unknown"></span></label>
          <label class="field">
            <span data-i="f_place"></span>
            <input type="text" id="place" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="places" data-i-ph="f_place_ph" />
            <ul class="places" id="places" role="listbox" hidden></ul>
            <span class="picked" id="placePicked" hidden></span>
          </label>
          <label class="check"><input type="checkbox" id="remember" checked /> <span data-i="f_remember"></span></label>
          <p class="error" id="formError" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-wide" id="go" data-i="f_go"></button>
        </form>

        <div id="result" hidden>
          <div class="card who">
            <h2 id="resName"></h2>
            <p class="muted" id="resMeta"></p>
            <div class="chips" id="chips"></div>
            <p class="note" id="unknownNote" hidden data-i="r_unknown"></p>
            <ul class="insight" id="insight"></ul>
          </div>

          <div class="card">
            <div class="chart-wrap">
              <div>
                <div id="chart"></div>
                <p class="legend-line" id="legend"></p>
              </div>
              <div class="table-wrap">
                <table id="planetTable">
                  <thead><tr><th data-i="t_graha"></th><th data-i="t_rashi"></th><th data-i="t_deg"></th><th data-i="t_house"></th><th data-i="t_nak"></th></tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
            <div class="dasha" id="dashaBox" hidden></div>
            <div class="callout" id="satiBox" hidden></div>
          </div>

          <div class="card" id="next">
            <h3 class="card-h" data-i="next_h"></h3>
            <div class="next">
              <button type="button" class="btn btn-primary" id="scrollReport" data-i="next_report"></button>
              <button type="button" class="btn btn-outline" id="shareBtn" data-i="next_share"></button>
              <a class="btn btn-outline" id="waBtn" href="#" target="_blank" rel="noopener" hidden data-i="next_wa"></a>
            </div>
            <a class="upsell" href="#premium">
              <b data-i="up_h"></b>
              <span data-i="up_p"></span>
            </a>
          </div>

          <div class="card" id="reportCard">
            <h3 class="card-h" data-i="rep_h"></h3>
            <div class="row">
              <label class="field">
                <span data-i="rep_focus"></span>
                <select id="topic">
                  <option value="general" data-i="rep_t_general"></option>
                  <option value="career" data-i="rep_t_career"></option>
                  <option value="marriage" data-i="rep_t_marriage"></option>
                </select>
              </label>
              <div class="field">
                <span data-i="rep_lang"></span>
                <div class="seg seg3" role="radiogroup" data-i-aria="rep_lang">
                  <label><input type="radio" name="lang" value="en" /><span>English</span></label>
                  <label><input type="radio" name="lang" value="hi" /><span>हिंदी</span></label>
                  <label><input type="radio" name="lang" value="hn" checked /><span>Hinglish</span></label>
                </div>
              </div>
            </div>
            <p class="error" id="reportError" role="alert" hidden></p>
            <div class="reading-actions">
              <button type="button" class="btn btn-dark" id="reportBtn" data-i="rep_btn"></button>
              <button type="button" class="btn btn-outline" id="printBtn" hidden data-i="rep_print"></button>
            </div>
            <div class="report" id="reportOut" hidden></div>
            <p class="fine" data-i="rep_fine"></p>
          </div>
        </div>
      </div>
    </section>

    <section class="block block--sun" id="premium" aria-labelledby="pr-h">
      <div class="wrap">
        <div class="sec-head">
          <h2 id="pr-h" data-i="pr_h"></h2>
          <p data-i="pr_p"></p>
        </div>
        <div class="plans">
          <article class="plan">
            <h3 data-i="pr_free"></h3>
            <p class="plan-sub" data-i="pr_free_sub"></p>
            <ul>
              <li data-i="pr_f1"></li><li data-i="pr_f2"></li><li data-i="pr_f3"></li><li data-i="pr_f4"></li>
            </ul>
            <a class="btn btn-outline btn-wide" href="#kundli" data-i="pr_free_cta"></a>
          </article>
          <article class="plan plan--premium">
            <span class="plan-tag" data-i="pr_tag"></span>
            <h3 data-i="pr_prem"></h3>
            <p class="plan-sub" data-i="pr_prem_sub"></p>
            <ul>
              <li data-i="pr_p1"></li><li data-i="pr_p2"></li><li data-i="pr_p3"></li><li data-i="pr_p4"></li><li data-i="pr_p5"></li>
            </ul>
            <button type="button" class="btn btn-primary btn-wide" id="premiumBtn" data-i="pr_cta"></button>
            <p class="plan-note" id="premiumNote" data-i="pr_note"></p>
          </article>
        </div>
      </div>
    </section>

    <section class="block block--night" id="how" aria-labelledby="how-h">
      <div class="wrap">
        <div class="sec-head">
          <h2 id="how-h" data-i="how_h"></h2>
          <p data-i="how_p"></p>
        </div>
        <ol class="steps">
          <li class="step"><img src="/img/step-1.png" alt="" width="640" height="640" loading="lazy" /><h3 data-i="how1_h"></h3><p data-i="how1_p"></p></li>
          <li class="step"><img src="/img/step-2.png" alt="" width="640" height="640" loading="lazy" /><h3 data-i="how2_h"></h3><p data-i="how2_p"></p></li>
          <li class="step"><img src="/img/step-3.png" alt="" width="640" height="640" loading="lazy" /><h3 data-i="how3_h"></h3><p data-i="how3_p"></p></li>
        </ol>
      </div>
    </section>

    <section class="block" id="store" aria-labelledby="store-h">
      <div class="wrap">
        <div class="store-banner">
          <img src="/img/store-banner.jpg" alt="" width="1600" height="600" loading="lazy" />
          <h2 id="store-h" data-i="store_h"></h2>
          <p data-i="store_p"></p>
          <a class="btn btn-primary" id="storeWa" href="#kundli" data-i="store_cta"></a>
        </div>
        <div class="products">
          <div class="product"><img src="/img/product-ganesha.jpg" alt="" width="800" height="800" loading="lazy" /><h3 data-i="p_ganesha"></h3><span data-i="p_soon"></span></div>
          <div class="product"><img src="/img/product-lakshmi.jpg" alt="" width="800" height="800" loading="lazy" /><h3 data-i="p_lakshmi"></h3><span data-i="p_soon"></span></div>
          <div class="product"><img src="/img/product-puja-kit.jpg" alt="" width="800" height="800" loading="lazy" /><h3 data-i="p_kit"></h3><span data-i="p_soon"></span></div>
          <div class="product"><img src="/img/product-rudraksha.jpg" alt="" width="800" height="800" loading="lazy" /><h3 data-i="p_rudraksha"></h3><span data-i="p_soon"></span></div>
        </div>
      </div>
    </section>

    <section class="block block--tight" id="faq" aria-labelledby="faq-h">
      <div class="wrap">
        <div class="sec-head"><h2 id="faq-h" data-i="faq_h"></h2></div>
        <div class="faq">
          <details><summary data-i="faq1q"></summary><p data-i="faq1a"></p></details>
          <details><summary data-i="faq2q"></summary><p data-i="faq2a"></p></details>
          <details><summary data-i="faq3q"></summary><p data-i="faq3a"></p></details>
          <details><summary data-i="faq4q"></summary><p data-i="faq4a"></p></details>
          <details><summary data-i="faq5q"></summary><p data-i="faq5a"></p></details>
        </div>
      </div>
    </section>

    <section class="final">
      <img src="/img/cta-banner.jpg" alt="" width="1600" height="600" loading="lazy" />
      <div class="wrap final-in">
        <h2 data-i="final_h"></h2>
        <p data-i="final_p"></p>
        <a class="btn btn-primary" href="#kundli" data-i="hero_cta1"></a>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <div class="brand"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29" fill="#f6b81c" stroke="#1b1b3a" stroke-width="5"/><path d="M32 3a29 29 0 0 1 0 58a18 29 0 0 0 0-58z" fill="#d8321a"/></svg>Shubhly</div>
      <p data-i="foot1"></p>
      <p data-i="foot2"></p>
    </div>
  </footer>

  <nav class="tabbar" aria-label="Quick">
    <a href="#aaj" data-tab="aaj"><i>☀</i><span data-i="tab_today"></span></a>
    <a href="#rashifal" data-tab="rashifal"><i>♈︎</i><span data-i="tab_rashifal"></span></a>
    <a href="#kundli" data-tab="kundli"><i>✦</i><span data-i="tab_kundli"></span></a>
    <a href="#premium" data-tab="premium"><i>★</i><span data-i="tab_premium"></span></a>
  </nav>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
